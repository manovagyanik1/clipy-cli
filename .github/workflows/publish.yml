name: Publish

# Publishes @clipy/cli to npm when a tag matching `v*` is pushed.
# Inert until the NPM_TOKEN secret is set on this repository.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # Skips a version npm already has, so a re-run is harmless instead of
      # failing on npm's E403 for a re-publish.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@clipy/cli@${VERSION}" version >/dev/null 2>&1; then
            echo "@clipy/cli@${VERSION} is already on npm; skipping npm publish."
          else
            npm publish --access public
          fi
